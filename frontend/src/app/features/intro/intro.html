<div
  class="intro"
  [class.leaving]="phase() === 'leaving'"
  [class.reduced]="reduced()"
  (click)="onHostClick()"
  role="presentation"
>
  <div class="stage">
    <!-- The A is not a separate mark that hands off to a logo: it IS the first
         letter of the wordmark. It shrinks into the line while the rest types
         beside it, the way Netflix's N sits inside NETFLIX. -->
    <div class="wordmark" [class.settled]="transformed()">
      <div class="netflixintro" letter="A" aria-hidden="true">
        @for (h of helpers; track h) {
          <div class="helper-{{ h }}">
            <div class="effect-brush">
              @for (f of furs; track f) { <span class="fur-{{ f }}"></span> }
            </div>
            <div class="effect-lumieres">
              @for (l of lamps; track l) { <span class="lamp-{{ l }}"></span> }
            </div>
          </div>
        }
      </div>

      <span class="typed" aria-hidden="true">{{ typed() }}</span>
      <span class="caret" [class.blinking]="typingDone()" aria-hidden="true"></span>
    </div>

    <p class="roles">
      <span class="role role-1">Software Development Engineer</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="role role-2">Freelancer</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="role role-3">Products that ship</span>
    </p>
  </div>

  <h1 class="sr-only">
    Amartya Panigrahi — Software Development Engineer, freelancer, products that ship
  </h1>

  <button
    class="sound"
    type="button"
    (click)="armSound($event)"
    [attr.aria-label]="soundArmed() ? 'Replay intro sound' : 'Enable intro sound'"
  >
    @if (soundArmed()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5m0-5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    }
  </button>

  @if (showSkip() || reduced()) {
    <button class="skip" type="button" (click)="skip()">Skip intro</button>
  }
</div>
