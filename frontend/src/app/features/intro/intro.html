<div
  class="intro"
  [class.pulled]="pulled()"
  [class.diving]="diving()"
  [class.leaving]="phase() === 'leaving'"
  [class.reduced]="reduced()"
  (click)="onHostClick()"
  role="presentation"
>
  <!-- The camera. Everything inside is what the lens is pointed at, so the pull
       back and the dive are one transform on one element. -->
  <div class="camera">
    <div class="wordmark">
      <!-- Beat 1: the A is brushed in at full screen. It cross-fades into the
           wordmark's own first letter during the pull back, while both are
           moving, so the handover is invisible. -->
      <div class="netflixintro" letter="A" aria-hidden="true">
        @for (h of helpers; track h) {
          <div class="helper-{{ h }}">
            <div class="effect-brush">
              @for (f of furs; track f) { <span class="fur-{{ f }}"></span> }
            </div>
            <div class="effect-lumieres">
              @for (l of lamps; track l) { <span class="lamp-{{ l }}"></span> }
            </div>
          </div>
        }
      </div>

      <!-- Beat 2: the name itself, each letter on its own arc. -->
      <div class="word" aria-hidden="true">
        @for (l of letters; track l.i) {
          <span class="ltr" [style.--i]="l.i">{{ l.char }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Beat 4: the colour bars the dive passes through. -->
  <div class="lightbars" aria-hidden="true">
    @for (b of bars; track b.i) {
      <span
        class="bar"
        [class.dim]="b.dim"
        [style.--hue]="b.hue"
        [style.--light.%]="b.light"
        [style.--w]="b.width + 'vw'"
        [style.--d.ms]="b.delay"
      ></span>
    }
  </div>

  <div class="flood" aria-hidden="true"></div>

  <h1 class="sr-only">Amartya Panigrahi — Software Development Engineer and freelancer</h1>

  <button
    class="sound"
    type="button"
    (click)="armSound($event)"
    [attr.aria-label]="soundArmed() ? 'Replay intro sound' : 'Enable intro sound'"
  >
    @if (soundArmed()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5m0-5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    }
  </button>

  @if (showSkip() || reduced()) {
    <button class="skip" type="button" (click)="skip()">Skip intro</button>
  }
</div>
