<div
  class="intro"
  [class.opened]="opened()"
  [class.diving]="diving()"
  [class.leaving]="phase() === 'leaving'"
  [class.reduced]="reduced()"
  (click)="onHostClick()"
  role="presentation"
>
  <div class="stage">
    <!-- The dive pivots on the R's stem, so it lives on its own element. -->
    <div class="wordmark" [style.--dive-x.%]="divePoint()">
      <!-- Centre-justified: the A sits in the middle on its own, and the rest
           of the name unfurls either side of it in one motion, which pushes the
           A left. The slide is a consequence of the layout rather than a second
           animation to keep in sync. -->
      @for (l of letters; track l.i) {
        <span
          class="ltr"
          [class.on]="l.i === 0 || grown()"
          [style.--i]="l.i"
        >{{ l.char }}</span>
      }
    </div>

    <p class="tagline" [class.on]="taglineIn()">Learn. Build. Inspire.</p>
  </div>

  <div class="lightbars" aria-hidden="true">
    @for (b of bars; track b.i) {
      <span
        class="bar"
        [class.dim]="b.dim"
        [style.--hue]="b.hue"
        [style.--light.%]="b.light"
        [style.--w]="b.width + 'vw'"
        [style.--d.ms]="b.delay"
      ></span>
    }
  </div>

  <div class="flood" aria-hidden="true"></div>

  <h1 class="sr-only">Amartya — learn, build, inspire</h1>

  <button
    class="sound"
    type="button"
    (click)="armSound($event)"
    [attr.aria-label]="soundArmed() ? 'Replay intro sound' : 'Enable intro sound'"
  >
    @if (soundArmed()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5m0-5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    }
  </button>

  @if (showSkip() || reduced()) {
    <button class="skip" type="button" (click)="skip()">Skip intro</button>
  }
</div>
