<div
  class="intro"
  [class.pulled]="pulled()"
  [class.diving]="diving()"
  [class.leaving]="phase() === 'leaving'"
  [class.reduced]="reduced()"
  (click)="onHostClick()"
  role="presentation"
>
  <!-- The camera. The pull back and the dive are one transform each on two
       nested elements, because they pivot on different points. -->
  <div class="camera" [style.--pivot.%]="firstCentre()">
    <div class="wordmark" [style.--dive-x.%]="divePoint()">
      @for (g of glyphs; track $index) {
        <!-- Each glyph is drawn from polygons, not set in a typeface, and is
             wiped on from the baseline up as it is "typed". -->
        <svg
          class="glyph"
          [class.on]="$index < shown()"
          [style.--w]="g.w"
          [style.--i]="$index"
          viewBox="0 0 100 140"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0.25">
              <stop offset="0%"   stop-color="#f5121e" />
              <stop offset="46%"  stop-color="#e50914" />
              <stop offset="46.5%" stop-color="#bd0710" />
              <stop offset="100%" stop-color="#e50914" />
            </linearGradient>
          </defs>
          @for (d of g.paths; track $index) {
            <path [attr.d]="d" />
          }
        </svg>
      }
    </div>
  </div>

  <!-- The colour bars the dive passes through. -->
  <div class="lightbars" aria-hidden="true">
    @for (b of bars; track b.i) {
      <span
        class="bar"
        [class.dim]="b.dim"
        [style.--hue]="b.hue"
        [style.--light.%]="b.light"
        [style.--w]="b.width + 'vw'"
        [style.--d.ms]="b.delay"
      ></span>
    }
  </div>

  <div class="flood" aria-hidden="true"></div>

  <h1 class="sr-only">Amartya Panigrahi — Software Development Engineer and freelancer</h1>

  <button
    class="sound"
    type="button"
    (click)="armSound($event)"
    [attr.aria-label]="soundArmed() ? 'Replay intro sound' : 'Enable intro sound'"
  >
    @if (soundArmed()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5m0-5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    }
  </button>

  @if (showSkip() || reduced()) {
    <button class="skip" type="button" (click)="skip()">Skip intro</button>
  }
</div>
