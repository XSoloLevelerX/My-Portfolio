<main class="home">
  @if (billboard(); as hero) {
    <app-billboard [project]="hero" (moreInfo)="openDetail($event)" (play)="onPlay($event)" />
  }

  <div class="shelves">
    @for (row of rows(); track row.key) {
      <app-row [row]="row" (open)="openDetail($event)" (playLive)="onPlay($event)" />
    }
  </div>

  <p class="catalogue-note">
    {{ total().length }} projects in the catalogue.
  </p>
</main>

<app-modal
  [project]="selected()"
  (close)="closeDetail()"
  (clickLive)="onClickLive($event)"
  (clickRepo)="onClickRepo($event)"
/>
