<article
  class="card"
  [style.--hue]="hue()"
  tabindex="0"
  role="button"
  [attr.aria-label]="project().title + ' — ' + project().tagline"
  (click)="onOpen()"
  (keydown.enter)="onOpen()"
  (keydown.space)="$event.preventDefault(); onOpen()"
>
  <div class="art" aria-hidden="true">
    <span class="monogram">{{ monogram() }}</span>
    @if (project().status === 'WIP') {
      <span class="flag">In progress</span>
    }
  </div>

  <!-- Netflix's hover panel: it grows out of the card rather than floating over
       it. The contents sit in one wrapper because the 0fr -> 1fr collapse only
       collapses a SINGLE grid child; several children get auto-sized rows. -->
  <div class="panel">
    <div class="panel-inner">
      <div class="actions">
        @if (project().liveUrl) {
          <button
            class="icon play"
            type="button"
            (click)="onPlay($event)"
            [attr.aria-label]="'Open ' + project().title"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 2.69127C4 1.93067 4.81547 1.44851 5.48192 1.81506L22.4069 11.1238C23.0977 11.5037 23.0977 12.4963 22.4069 12.8762L5.48192 22.1849C4.81546 22.5515 4 22.0693 4 21.3087V2.69127Z"/>
            </svg>
          </button>
        }

        <button
          class="icon"
          type="button"
          (click)="onSave($event)"
          [class.saved]="saved()"
          [attr.aria-pressed]="saved()"
          [attr.aria-label]="(saved() ? 'Remove ' : 'Add ') + project().title + ' to My List'"
        >
          @if (saved()) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.2928 4.29285L22.7071 5.70706L9.99995 18.4142L3.29285 11.7071L4.70706 10.2928L9.99995 15.5857L21.2928 4.29285Z"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 11V2H13V11H22V13H13V22H11V13H2V11H11Z"/>
            </svg>
          }
        </button>

        <button
          class="icon"
          type="button"
          (click)="onLike($event)"
          [class.liked]="liked()"
          [attr.aria-pressed]="liked()"
          [attr.aria-label]="'Like ' + project().title"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.696 8.7732C10.8947 8.45534 11 8.08804 11 7.7132V4H11.8377C12.7152 4 13.4285 4.55447 13.6073 5.30676C13.8058 6.14169 14 7.19493 14 8C14 8.35754 13.9613 8.75027 13.9067 9.11669L13.7263 10.3266H14.9503H19.2846C20.0349 10.3266 20.6152 10.9866 20.5192 11.7308L19.5851 18.9694C19.5058 19.5842 18.9824 20.0448 18.3626 20.0448H12.0002C10.3433 20.0448 9.00021 18.7016 9.00021 17.0448V10.4472L10.696 8.7732ZM11.9998 2C10.3429 2 9.00021 3.34315 9.00021 5V7.29289L7.00021 9.29289V9H2.00021V22H7.00021V21.5H8.53073C9.30596 21.8209 10.1362 22 11.0002 22H18.3626C20.0472 22 21.4726 20.7526 21.6712 19.0784L22.6053 11.8398C22.8563 9.89425 21.2761 8.3266 19.2846 8.3266H16.0002C16.0002 7.1866 15.7616 6.05169 15.5385 5.11169C15.1148 3.32944 13.5148 2 11.8377 2H11.9998ZM5.00021 20V11H4.00021V20H5.00021Z"/>
          </svg>
        </button>

        <!-- Pushed right, as Netflix does: it opens the detail view. -->
        <button
          class="icon more"
          type="button"
          (click)="onOpen()"
          [attr.aria-label]="'More about ' + project().title"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.2929 16.7071L1.29289 6.70711L2.70711 5.29289L12 14.5858L21.2929 5.29289L22.7071 6.70711L12.7071 16.7071C12.3166 17.0976 11.6834 17.0976 11.2929 16.7071Z"/>
          </svg>
        </button>
      </div>

      <h4 class="title">{{ project().title }}</h4>

      <p class="meta">
        <span class="match">{{ match() }}% match</span>
        <span class="rating">{{ badge() }}</span>
        @if (year()) { <span>{{ year() }}</span> }
      </p>

      <ul class="stack">
        @for (s of project().stack.slice(0, 3); track s; let last = $last) {
          <li>{{ s }}@if (!last) { <span class="sep" aria-hidden="true">•</span> }</li>
        }
      </ul>
    </div>
  </div>
</article>
