<header class="nav" [class.solid]="scrolled()">
  <a class="brand" href="/" aria-label="Amartya Panigrahi — home">
    <!-- The same mark the intro docks into. -->
    <svg class="brand-mark" viewBox="0 0 200 220" aria-hidden="true">
      <path d="M100 22 L28 200" />
      <path d="M100 22 L172 200" />
      <path d="M60 150 L140 150" />
    </svg>
    <span class="brand-word">AMARTYA</span>
  </a>

  <nav class="links" aria-label="Primary">
    @for (l of links; track l.path) {
      <a class="link" [href]="l.path">{{ l.label }}</a>
    }
  </nav>

  <button
    class="burger"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Menu"
  >
    <span></span><span></span><span></span>
  </button>

  @if (menuOpen()) {
    <nav class="drawer" aria-label="Primary mobile">
      @for (l of links; track l.path) {
        <a class="drawer-link" [href]="l.path">{{ l.label }}</a>
      }
    </nav>
  }
</header>
