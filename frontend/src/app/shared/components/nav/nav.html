<header class="nav" [class.solid]="scrolled()">
  <!-- The same wordmark the intro resolves into, so the logo and the title
       sequence read as one identity rather than two marks. -->
  <a class="brand" href="/" aria-label="Amartya — home">
    <span class="brand-word">AMARTYA</span>
  </a>

  <nav class="links" aria-label="Primary">
    @for (l of links; track l.path) {
      <a class="link" [href]="l.path">{{ l.label }}</a>
    }
  </nav>

  <button
    class="burger"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Menu"
  >
    <span></span><span></span><span></span>
  </button>

  @if (menuOpen()) {
    <nav class="drawer" aria-label="Primary mobile">
      @for (l of links; track l.path) {
        <a class="drawer-link" [href]="l.path">{{ l.label }}</a>
      }
    </nav>
  }
</header>
